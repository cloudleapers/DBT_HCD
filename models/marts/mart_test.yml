version: 2

models:

  # -----------------------------------------------------------------------
  - name: dim_patients
    description: "One row per unique patient. Includes appointment metrics and plan tier."

    columns:

      - name: patient_sk
        description: "Surrogate key — hashed from patient_id"
        tests:
          - not_null
          - unique

      - name: patient_id
        description: "Natural / business key from source"
        tests:
          - not_null
          - unique

      - name: total_appointments
        description: "Count of all appointments for this patient"
        tests:
          - not_null

  # -----------------------------------------------------------------------
  - name: fct_appointments
    description: "One row per appointment."

    columns:

      - name: appointment_id
        description: "Natural key from source"
        tests:
          - not_null
          - unique

      - name: patient_id
        description: "FK natural key to dim_patients"
        tests:
          - not_null
          - relationships:
              to: ref('dim_patients')
              field: patient_id

      - name: status
        description: "Uppercased appointment status"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - SCHEDULED
                  - COMPLETED
                  - CANCELLED

      - name: appointment_sk
        description: "Appointment surrogate key"
        tests:
          - not_null
          - unique